context:
  version: "0.2.4"

package:
  name: labware
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/l/labware/labware-${{ version }}.tar.gz
  sha256: da6e3e088c5294d439e11c035e28e84637af937fdd1479d441f742a5cfb5056d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=77
  run:
    - python >=${{ python_min }}
    - pydantic >=2

tests:
  - python:
      imports:
        - labware
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest
    script:
      - pytest tests

about:
  homepage: https://github.com/ramonaoptics/labware
  repository: https://github.com/ramonaoptics/labware
  summary: Microplate and dish definitions for software
  description: |
    Microplate and dish definitions: outer footprint, well geometry, skirt,
    material, and the vendor drawing each dimension came from. One JSON file
    per part, validated by a pydantic model that is also published as a JSON
    schema.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - kingbedjed
    - claydugo
